[package]
name = "digoo-lcd"
version = "0.1.0"
edition = "2021"
description = "Núcleo nativo (Rust) do Digoo LCD Studio — foco em pouca memória e velocidade"
license = "MIT"

[[bin]]
name = "digoo-lcd"
path = "src/main.rs"

[dependencies]
serialport = "4.6"
tiny-skia = "0.11"
fontdue = "0.9"
jpeg-encoder = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2" # cliente HTTP (letras LRCLIB + tradução); rustls+webpki embutidos, sem dependência de cert do SO
jpeg-decoder = { version = "0.3", default-features = false } # capa JPEG; sem rayon (miniatura é pequena)
png = "0.17"         # decodifica a capa do álbum em PNG — puro Rust, enxuto

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
